<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이용 만족도 — 해봄 기후안심 통합지도</title>
<style>
  :root{--green:#1f8a4c;--bg:#f6f7f5;--ink:#1b1f1c;--muted:#6b7570;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
  .phone{max-width:420px;width:100%;}
  .step{background:#fff;border-radius:18px;padding:28px 22px;box-shadow:0 2px 10px rgba(0,0,0,.08);text-align:center;}
  h1{font-size:1.1rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:20px;}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--green);color:#fff;
       font-size:1rem;font-weight:700;cursor:pointer;margin-top:16px;}
  .btn.secondary{background:#eef3ee;color:#33443a;}
  .check{font-size:3.5rem;color:var(--green);}
  .scale{display:flex;justify-content:space-between;margin:18px 0;gap:8px;}
  .scale button{flex:1;padding:14px 0;border-radius:10px;border:1px solid #d7ddd8;background:#fff;font-size:1.1rem;cursor:pointer;}
  .scale button.sel{background:var(--green);color:#fff;border-color:var(--green);}
  .scale-labels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:-10px;}
  .place-name{font-weight:700;}
  .hidden{display:none;}
  .footer-note{font-size:.72rem;color:var(--muted);margin-top:18px;line-height:1.5;}
</style>
</head>
<body>
<div class="phone">

  <!-- STEP 1: 길찾기로 이동 안내 -->
  <div class="step" id="step1">
    <div style="font-size:3rem;">🧭</div>
    <h1><span class="place-name" id="placeName1"></span>(으)로 길찾기</h1>
    <p class="sub">가까운 쉼터로 이동해서 잠시 쉬어가세요. 도착하시면 아래 버튼을 눌러 짧은 질문에 답해주시면 다음 쉼터 확대에 큰 도움이 됩니다.</p>
    <button class="btn" id="arrived">도착했어요 · 짧은 질문 답하기</button>
    <p class="footer-note">※ 이 서비스는 새 가게를 만드는 대신, 이미 있는 무더위쉼터·은행·마트·편의점 정보를 모아 보여드리는 통합 지도입니다.</p>
  </div>

  <!-- STEP 2: 만족도 질문 -->
  <div class="step hidden" id="step2">
    <h1>이용해 보니 어떠셨나요?</h1>
    <p class="sub" id="placeName2"></p>
    <p class="sub">이곳에서 쉬고 난 뒤, 더위 불편함이 줄었나요?</p>
    <div class="scale" id="scoreScale">
      <button data-v="1">①</button><button data-v="2">②</button><button data-v="3">③</button>
      <button data-v="4">④</button><button data-v="5">⑤</button>
    </div>
    <div class="scale-labels"><span>전혀 아니다</span><span>매우 그렇다</span></div>
    <button class="btn" id="submit" disabled>제출</button>
  </div>

  <!-- STEP 3: 완료 -->
  <div class="step hidden" id="step3">
    <div class="check">🙏</div>
    <h1>감사합니다!</h1>
    <p class="sub">보내주신 답변은 앞으로 어느 지역에 쉼터 안내가 더 필요한지 판단하는 근거로 쓰입니다.</p>
    <p class="footer-note" id="summary"></p>
    <button class="btn secondary" onclick="location.href='index.html'">지도로 돌아가기</button>
    <button class="btn secondary" onclick="location.href='dashboard.html'">커버리지 대시보드 보기</button>
  </div>

</div>

<script src="data.js"></script>
<script type="module">
  import { firebaseReady, addSatisfaction } from './firebase.js';

  const params = new URLSearchParams(location.search);
  const placeId = params.get('place') || PLACES[0].id;
  const place = PLACES.find(p => p.id === placeId) || PLACES[0];
  const meta = CATEGORY_META[place.category] || {};
  document.getElementById('placeName1').textContent = `${meta.icon || ''} ${place.name}`;
  document.getElementById('placeName2').textContent = `${meta.icon || ''} ${place.name}`;

  const DEVICE_KEY = 'climatesafe_device_id';
  let deviceId = localStorage.getItem(DEVICE_KEY);
  if (!deviceId) {
    deviceId = 'dev-' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem(DEVICE_KEY, deviceId);
  }

  if (!firebaseReady) {
    document.querySelector('.footer-note').textContent +=
      ' (firebase-config.js 미설정 — 현재는 로컬 시뮬레이션 모드로 동작 중입니다.)';
  }

  function show(id) {
    document.querySelectorAll('.step').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  document.getElementById('arrived').addEventListener('click', () => show('step2'));

  let score = null;
  document.getElementById('scoreScale').addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    score = e.target.dataset.v;
    [...e.currentTarget.children].forEach(b => b.classList.remove('sel'));
    e.target.classList.add('sel');
    document.getElementById('submit').disabled = false;
  });

  document.getElementById('submit').addEventListener('click', async () => {
    const btn = document.getElementById('submit');
    btn.disabled = true;
    btn.textContent = '저장 중...';
    if (firebaseReady) {
      await addSatisfaction({ placeId: place.id, deviceId, score: Number(score) });
    }
    document.getElementById('summary').textContent =
      `기록됨 — 장소: ${place.name} / 만족도: ${score}점` +
      (firebaseReady ? '' : ' — 시뮬레이션 모드, Firestore에는 저장되지 않았습니다.');
    show('step3');
  });
</script>
</body>
</html>
