<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>커버리지 대시보드 — 해봄 기후안심 통합지도</title>
<style>
  :root{--green:#1f8a4c;--amber:#e08b1f;--blue:#2b6fd1;--red:#c0392b;--bg:#f6f7f5;--card:#fff;--ink:#1b1f1c;--muted:#6b7570;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--ink);color:#fff;padding:16px 20px;}
  header h1{margin:0;font-size:1.1rem;}
  header p{margin:4px 0 0;font-size:.78rem;opacity:.75;}
  main{padding:16px 16px 90px;max-width:900px;margin:0 auto;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
  .stat{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center;}
  .stat .num{font-size:1.5rem;font-weight:800;}
  .stat .lbl{font-size:.72rem;color:var(--muted);margin-top:2px;}
  section{margin-bottom:22px;}
  section h2{font-size:.95rem;margin:0 0 10px;}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  th,td{padding:10px 12px;text-align:left;font-size:.82rem;border-bottom:1px solid #eef1ee;}
  th{background:#f0f2ef;color:var(--muted);font-weight:600;}
  tr:last-child td{border-bottom:none;}
  .bar-wrap{background:#eef1ee;border-radius:6px;overflow:hidden;height:8px;margin-top:4px;}
  .bar{height:100%;}
  .note{font-size:.72rem;color:var(--muted);}
  .callout{background:#fff7e8;border:1px dashed var(--amber);border-radius:10px;padding:12px;font-size:.82rem;line-height:1.5;}
  footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3e6e2;display:flex;}
  footer a{flex:1;text-align:center;padding:10px 0;font-size:.75rem;color:var(--muted);text-decoration:none;}
  footer a.active{color:var(--green);font-weight:700;}
</style>
</head>
<body>
<header>
  <h1>📊 커버리지 대시보드</h1>
  <p>B안(기존 인프라 통합형) — "가게를 새로 만드는 게 아니라, 있는 걸 찾기 쉽게" 진행 현황</p>
</header>
<main>
  <section>
    <h2>등록 거점 현황</h2>
    <div class="grid" id="summaryGrid"></div>
    <div class="callout" id="coverageNote"></div>
  </section>

  <section>
    <h2>카테고리별 등록 현황</h2>
    <table>
      <thead><tr><th>카테고리</th><th>등록 수</th><th>비중</th></tr></thead>
      <tbody id="catRows"></tbody>
    </table>
  </section>

  <section>
    <h2>오늘 이용 데이터 (길찾기 클릭 + 만족도)</h2>
    <div class="grid" id="usageGrid"></div>
    <p class="note">※ 기존 시설에는 NFC를 붙일 수 없으므로, "길찾기 버튼 클릭"을 이용 시도의 대리 지표로, 도착 후 1문항 설문을 만족도 지표로 사용합니다. (같은 기기+같은 장소+같은 날짜는 하루 1회만 인정)</p>
  </section>

  <section>
    <h2>거점별 이용 데이터</h2>
    <table>
      <thead><tr><th>장소</th><th>카테고리</th><th>길찾기 클릭(인정)</th><th>평균 만족도</th></tr></thead>
      <tbody id="placeRows"></tbody>
    </table>
  </section>
</main>

<footer>
  <a href="index.html">🗺 통합지도</a>
  <a href="dashboard.html" class="active">📊 커버리지 대시보드</a>
</footer>

<script src="data.js"></script>
<script type="module">
  import { firebaseReady, fetchPlaces, listenTodayVisits, listenTodayFeedback } from './firebase.js';

  if (!firebaseReady) {
    document.querySelector('header p').textContent += ' (firebase-config.js 미설정 — 로컬 데이터로 표시 중)';
  }

  let places = [];
  let visits = [];
  let feedback = [];

  function render() {
    const byCat = {};
    places.forEach(p => { byCat[p.category] = (byCat[p.category] || 0) + 1; });

    const remaining = Math.max(CATEGORY_TOTAL_KNOWN - places.length, 0);
    const coveragePct = Math.min(Math.round((places.length / CATEGORY_TOTAL_KNOWN) * 100), 100);

    document.getElementById('summaryGrid').innerHTML = `
      <div class="stat"><div class="num">${places.length}</div><div class="lbl">등록된 거점 (실데이터)</div></div>
      <div class="stat"><div class="num">${CATEGORY_TOTAL_KNOWN}</div><div class="lbl">현재까지 확인된 남구 KT 지점 수</div></div>
      <div class="stat"><div class="num">${coveragePct}%</div><div class="lbl">현재 데이터 확보율</div></div>
    `;

    document.getElementById('coverageNote').innerHTML = remaining > 0
      ? `📍 아직 ${remaining}곳의 실제 위치 데이터가 필요합니다. 공공데이터포털·부산시 공식 목록 추가 확인 또는 현장 조사로 채워 넣으면 자동으로 이 대시보드와 지도에 반영됩니다.`
      : `✅ 부산시 공식 목록에서 파악된 남구 KT 지점을 모두 등록했습니다. 다른 구·군 또는 다른 카테고리(은행·마트·편의점)로 PoC를 확대하려면 data.js에 추가하세요.`;

    const catRows = document.getElementById('catRows');
    catRows.innerHTML = '';
    Object.entries(CATEGORY_META).forEach(([key, meta]) => {
      const count = byCat[key] || 0;
      const pct = places.length ? Math.round((count / places.length) * 100) : 0;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${meta.icon} ${meta.label}</td>
        <td>${count}</td>
        <td>
          <div>${pct}%</div>
          <div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${meta.color}"></div></div>
        </td>
      `;
      catRows.appendChild(tr);
    });

    const totalClicks = visits.length;
    const countedClicks = visits.filter(v => v.counted).length;
    const avgScore = feedback.length
      ? (feedback.reduce((s, f) => s + (f.score || 0), 0) / feedback.length).toFixed(1)
      : '-';

    document.getElementById('usageGrid').innerHTML = `
      <div class="stat"><div class="num">${totalClicks}</div><div class="lbl">전체 길찾기 클릭</div></div>
      <div class="stat"><div class="num">${countedClicks}</div><div class="lbl">인정된 이용 시도</div></div>
      <div class="stat"><div class="num">${feedback.length}</div><div class="lbl">만족도 응답 수</div></div>
      <div class="stat"><div class="num">${avgScore}</div><div class="lbl">평균 만족도 (5점 만점)</div></div>
    `;

    const placeRows = document.getElementById('placeRows');
    placeRows.innerHTML = '';
    places.forEach(p => {
      const meta = CATEGORY_META[p.category] || {};
      const pVisits = visits.filter(v => v.placeId === p.id && v.counted).length;
      const pFeedback = feedback.filter(f => f.placeId === p.id);
      const pAvg = pFeedback.length
        ? (pFeedback.reduce((s, f) => s + (f.score || 0), 0) / pFeedback.length).toFixed(1)
        : '-';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${meta.icon || ''} ${p.name}</td><td>${meta.label || p.category}</td><td>${pVisits}</td><td>${pAvg}</td>`;
      placeRows.appendChild(tr);
    });
  }

  async function init() {
    places = firebaseReady ? ((await fetchPlaces()) || []) : PLACES;
    if (firebaseReady && !places.length) places = PLACES;
    render();

    if (firebaseReady) {
      listenTodayVisits(v => { visits = v; render(); });
      listenTodayFeedback(f => { feedback = f; render(); });
    }
  }

  init();
</script>
</body>
</html>
